services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: deploy/backend.env
    environment:
      DATA_DIR: /app-data
      LAYOUTLM_MODEL_ROOT: /models
      LAYOUTLM_DEVICE: cpu
      HF_HOME: /hf-cache
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${MODEL_HOST_PATH:-./model_artifacts}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - app_data:/app-data
      - hf_cache:/hf-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  app_data:
  hf_cache:
